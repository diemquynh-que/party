<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Mời Sinh Nhật Dễ Thương</title>
    <!-- Import font chữ tròn trịa, đáng yêu từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === CÀI ĐẶT HÌNH NỀN CỦA BẠN TẠI ĐÂY === */
        body {
            /* Bạn vẫn giữ nguyên tên file ảnh nền của mình ở đây */
            background-image: url('nen.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            font-family: 'Baloo 2', cursive;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Lớp phủ pastel mờ để ảnh nền của bạn không làm mờ chữ */
        /*body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 240, 245, 0.85); /* Màu hồng nhạt trong suốt */
            z-index: -1; 
        }

        /* Khung viền thiệp mời chung */
        .cute-card {
            background-color: #ffffff;
            border: 4px dashed #ffb6c1; /* Viền nét đứt màu hồng pastel */
            border-radius: 40px; /* Bo góc tròn xoe */
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
            max-width: 500px;
            width: 90%;
            position: relative; /* Để đặt các hình dán (sticker) */
            transition: opacity 0.5s ease-in-out;
        }

        /* Hình dán Stickers dễ thương */
        .sticker {
            position: absolute;
            font-size: 45px;
            z-index: 10;
            animation: float 3s ease-in-out infinite;
        }
        .st-1 { top: -20px; left: -20px; transform: rotate(-15deg); }
        .st-2 { top: -20px; right: -20px; transform: rotate(15deg); animation-delay: 0.5s; }
        .st-3 { bottom: -20px; left: -15px; transform: rotate(-10deg); animation-delay: 1s; }
        .st-4 { bottom: -20px; right: -15px; transform: rotate(20deg); animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(10deg); }
        }

        /* Quản lý chuyển màn hình */
        .hidden {
            display: none !important;
        }

        h1 {
            color: #f06462; /* Màu hồng dâu */
            font-size: 35px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        
        .subtitle {
            color: #f0f0f0;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* --- MÀN HÌNH 1: CHỌN NGƯỜI CHƠI --- */
        .guest-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .guest-btn {
            background-color: #ffe4e1;
            color: #050001;
            border: 2px solid #fff0f5;
            border-radius: 25px; /* Nút bo tròn */
            padding: 12px 20px;
            font-family: 'Baloo 2', cursive;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
        }

        .guest-btn:hover {
            background-color: #ffb6c1;
            color: #fff;
            transform: translateY(-5px); /* Hiệu ứng nhảy lên khi di chuột */
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.6);
        }

        /* --- MÀN HÌNH 2: THÔNG TIN CHI TIẾT --- */
        .guest-avatar {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border: 5px solid #ffb6c1;
            border-radius: 50%; /* Khung ảnh tròn xoe */
            margin: 0 auto 15px auto;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.5);
            background-color: #fff;
        }

        .guest-message {
            color: #705d63; /* Chữ màu nâu xám dễ đọc */
            font-size: 20px;
            line-height: 1.2;
            margin-bottom: 25px;
            text-align: left;
            padding: 20px;
            border-radius: 20px;
            background: #fff0f5;
            border: 2px dashed #ffb6c1;
        }

        .back-btn {
            background-color: #ffb6c1;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 25px;
            font-family: 'Baloo 2', cursive;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4);
            transition: 0.3s;
        }
        
        .back-btn:hover {
            background-color: #afb1ef;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: MÀN HÌNH CHÍNH -->
    <div id="screen-main" class="cute-card">
        <!-- Các hình dán (Stickers) góc thiệp -->
        <div class="sticker st-1">🎂</div>
        <div class="sticker st-2">🎈</div>
        <div class="sticker st-3">🎁</div>
        <div class="sticker st-4">🎀</div>

        <h1>SINH NHẶC CỦA QUỲNH QUỲNH <3</h1>
        <div class="subtitle">Dưới đây là một chút tâm tư em dành cho mọi người. Mong mọi người sẽ không chê. Tìm tên của mình bên dưới nhó 👇</div>
        
        <div id="buttons-container" class="guest-list">
            <!-- Nút bấm chèn tự động -->
        </div>
    </div>

    <!-- MÀN HÌNH 2: MÀN HÌNH LỜI MỜI RIÊNG -->
    <div id="screen-detail" class="cute-card hidden">
        <!-- Các hình dán (Stickers) màn hình 2 -->
        <div class="sticker st-1">🧸</div>
        <div class="sticker st-2">🥳</div>
        <div class="sticker st-3">🍰</div>
        <div class="sticker st-4">✨</div>

        <h1 id="display-name" style="font-size: 26px;">Tên Khách</h1>
        
        <img id="display-image" class="guest-avatar" src="" alt="Guest Image">
        
        <div id="display-message" class="guest-message">
            Lời mời sẽ hiện ở đây...
        </div>

        <button class="back-btn" onclick="quayLai()">
            « Quay lại
        </button>
    </div>

    <script>
        /* === NHẬP THÔNG TIN 5 NGƯỜI BẠN CỦA BẠN TẠI ĐÂY === */
        const danhSachKhach = [
            {

            },
            {
                ten: "NGUYỄN NGỌC LAN CHI",
                anh: "mie.jpg",
                loiMoi: "🎉 <b>Bữa tiệc:</b> Hè lố chị Mie iu dấu. Ban đầu em gặp chị là em phải quaoo mình gặp người có máu mặt ròi. Hehe nói dị hui chứ chị siêu cấp đáng iuu. Sắp tới đây là sanh nhặc em, em muốn mời chị một bữa ăn nho nhỏ mong chị đến chung dui với động tơ nhện nhỏ bé này.<br><br>⏰ <b>Thời gian:</b> 18:00 - 17/09/2026<br><br>💌 <b>Địa điểm:</b> Tầng 3, Hadilao Nha Trang Center!.<br><br>📍 <b>Dresscode:</b> Pyjama<br>" 
            },
            {
                ten: "HOÀNG ĐỨC TRUNG",
                anh: "trung-hoang.jpg",
                loiMoi: "🎉 <b>Bữa tiệc:</b> Eyyo bro. Ngày đầu gặp cưng, chị khá quào vì cưng nói chuyện còn nhỏ nhẹ hơn chị nữa, mà càng chơi về sau mới lộ bản chất thật mình ra hay liếc người taa. Hẹ hẹ nói dị hui sắp tới là sinh nhặt chị, chị muốn mời em tới cái động yêu nhền nhện này để quậy.<br><br>⏰ <b>Thời gian:</b> 18:00 - 17/09/2026<br><br>💌 <b>Địa điểm:</b> Tầng 3, Hadilao Nha Trang Center!.<br><br>📍 <b>Dresscode:</b> Pyjama<br>"

            {

            },
            {
                ten: "PHAN TRÚC PHƯƠNG",
                anh: "truc-phuong.jpg",
                loiMoi: "🎉 <b>Bữa tiệc:</b> Haii, lần đầu gặp em em khá thân thiện, hoạt bát mà hay ovtk ai làm gì cũng ovtk. Đừng suy nghĩ người ta nghĩ như nào về mình hãy làm chính mình nhenn. Dù biết em bận ó nhưng mà nếu được thì sắp xếp đến với chị nhe. Thiếu em thì chị buồn lắm ó.<br><br>⏰ <b>Thời gian:</b> 18:00 - 18/09/2026<br><br>💌 <b>Địa điểm:</b> Tầng 3, Hadilao Nha Trang Center!.<br><br>📍<b>Dresscode:</b> Pyjama<br>"
            }
        ];

        const container = document.getElementById('buttons-container');
        
        danhSachKhach.forEach((khach, index) => {
            const btn = document.createElement('button');
            btn.className = 'guest-btn';
            btn.innerText = `💕 ${khach.ten}`; // Thêm icon trái tim trước tên
            
            btn.onclick = function() {
                moManHinhChiTiet(index);
            };
            
            container.appendChild(btn);
        });

        function moManHinhChiTiet(index) {
            const khach = danhSachKhach[index];
            
            document.getElementById('display-name').innerText = khach.ten;
            document.getElementById('display-image').src = khach.anh;
            document.getElementById('display-message').innerHTML = khach.loiMoi;

            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-detail').classList.remove('hidden');
        }

        // ... (các đoạn code cũ phía trên giữ nguyên) ...

        function quayLai() {
            document.getElementById('screen-detail').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
        }
    </script>

    <!-- BẮT ĐẦU DÁN CODE NHẠC MỚI VÀO ĐÂY -->
    <audio id="nhacNen" src="joyride.mp3" loop></audio>
    <script>
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('nhacNen');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>
    <!-- KẾT THÚC DÁN CODE NHẠC -->

</body>
</html>
